<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style/calculator.css" />
    <title>Квиз по кухне</title>
  </head>
  <body>
    <!-- Секция калькулятора/квиза: основной контейнер для всего квиза -->
    <section class="calculator" id="calculator">
      <div class="container calculator__container">
        <!-- Заголовок квиза -->
        <h2 class="calculator__title">Рассчитайте стоимость кухни</h2>
        <!-- Подзаголовок, объясняющий цель квиза -->
        <p class="calculator__subtitle">
          Ответьте на несколько вопросов и узнайте предварительную стоимость
          вашей будущей кухни
        </p>

        <!-- Основной блок вопросов квиза, инициализированный Alpine.js -->
        <div
          class="questions questions__container"
          x-data="quiz()"
          x-init="init()"
        >
          <!-- Блок с вопросами -->
          <div x-show="!showResults">
            <template x-for="(question, index) in questions" :key="index">
<div
                x-show="currentQuestionIndex === index"
                x-transition:enter="slide-enter"
                x-transition:enter-start="slide-enter-start"
                x-transition:enter-end="slide-enter-end"
                x-transition:leave="slide-leave"
                x-transition:leave-start="slide-leave-start"
                x-transition:leave-end="slide-leave-end"
              >
                <div class="questions__question-wrapper">
                  <div class="questions__question-title">
                    <span x-text="question.question"></span>
                  </div>

                  <!-- Изображение вопроса -->
                  <template x-if="question.image">
                    <div class="question-image-container">
                      <img :src="question.image" alt="Поясняющее изображение" />
                    </div>
                  </template>

                  <!-- RADIO -->
                  <template x-if="question.type === 'radio'">
                    <div
                      class="questions__answer-images"
                      :class="question.customClass"
                    >
                      <template
                        x-for="answer in question.answers"
                        :key="answer.value"
                      >
                        <label
                          class="questions__answer-image"
                          :class="{ 'selected': question.selectedAnswer === answer.value }"
                        >
                          <input
                            type="radio"
                            :name="'question-' + index"
                            :value="answer.value"
                            x-model="questions[index].selectedAnswer"
                            class="sr-only"
                          />
                          <img :src="answer.image" :alt="answer.text" />
                          <span x-text="answer.text"></span>
                        </label>
                      </template>
                    </div>
                  </template>

                  <!-- RANGE -->
                  <template x-if="question.type === 'range'">
                    <div class="range-slider">
                      <input
                        type="range"
                        :min="question.min"
                        :max="question.max"
                        :step="question.step"
                        x-model.number="questions[index].selectedAnswer"
                      />
                      <div class="range-value">
                        <span x-text="question.selectedAnswer"></span>
                        <span x-text="question.unit"></span>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <!-- Навигационная панель -->
            <div class="questions__navbar">
              <div class="questions__navbar-progress">
                <div
                  class="questions__navbar-progress-bar"
                  :style="`width: ${progress}%`"
                ></div>
              </div>
              <div class="questions__navbar-buttons">
                <button
                  class="questions__navbar__prev-button"
                  @click="prevQuestion()"
                  :disabled="currentQuestionIndex === 0"
                >
                  Назад
                </button>
                <button
                  class="questions__navbar__next-button"
                  @click="nextQuestion()"
                  :disabled="!questions[currentQuestionIndex].selectedAnswer && questions[currentQuestionIndex].type === 'radio'"
                >
                  <span
                    x-text="currentQuestionIndex < questions.length - 1 ? 'Далее' : 'Результат'"
                  ></span>
                </button>
              </div>
            </div>
          </div>

          <!-- Экран результатов -->
          <div x-show="showResults">
            <h2>Результаты</h2>
            <ul>
              <template x-for="(question, index) in questions" :key="index">
                <li>
                  <span x-text="question.question"></span>:
                  <strong x-text="getAnswerText(question)"></strong>
                </li>
              </template>
            </ul>
            <button @click="restartQuiz()">Начать заново</button>
          </div>
        </div>
      </div>
    </section>
    <!-- Подключение Alpine.js (отложенная загрузка) -->
    <script defer src="js/alpine.min.js"></script>
    <!-- Подключение основного скрипта квиза -->
    <script src="js/calculator.js"></script>
  </body>
</html>
